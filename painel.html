<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel do Representante · Solturi</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap');
:root{--red:#EC0000;--red-soft:#FDECEC;--bg:#F0F0F0;--card:#fff;--ink:#1F1F1F;--mid:#6B6B6B;--line:#E6E6E6;--ok:#0E7A55;--side:#141414}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Archivo','Helvetica Neue',Arial,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

/* ---------- login ---------- */
#login{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
#login .box{background:#fff;border-radius:20px;padding:30px 26px;max-width:360px;width:100%;box-shadow:0 6px 26px rgba(0,0,0,.10)}
#login h1{font-size:19px;margin-bottom:4px}
#login p.sub{font-size:13px;color:var(--mid);margin-bottom:22px}
#login label{display:block;font-size:12px;font-weight:600;color:var(--mid);margin:12px 0 4px}
#login input{width:100%;border:2px solid var(--line);border-radius:12px;padding:11px 12px;font-size:15px}
#login input:focus{outline:0;border-color:var(--red)}
#login button.principal{width:100%;margin-top:18px;border:0;border-radius:12px;background:var(--red);color:#fff;font-weight:700;padding:13px}
#login .erro{color:var(--red);font-size:13px;font-weight:600;min-height:18px;margin-top:10px}
.demo{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.demo p{font-size:12px;color:var(--mid);margin-bottom:10px}
.demo div{display:flex;gap:8px}
.demo button{flex:1;border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px;font-size:13px;font-weight:600}
.demo button:hover{border-color:var(--ink)}

/* ---------- estrutura ---------- */
.layout{display:flex;min-height:100vh}
aside{width:246px;flex:none;background:var(--side);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
aside .marca{padding:20px 20px 16px;border-bottom:1px solid rgba(255,255,255,.10)}
aside .marca b{font-size:16px;letter-spacing:.2px}
aside .marca span{display:block;font-size:11px;color:#9A9A9A;margin-top:2px}
nav{flex:1;overflow-y:auto;padding:12px 10px}
nav button{width:100%;display:flex;align-items:center;gap:11px;background:transparent;border:0;color:#C9C9C9;padding:11px 12px;border-radius:12px;font-size:14px;font-weight:600;text-align:left;margin-bottom:2px}
nav button:hover{background:rgba(255,255,255,.07);color:#fff}
nav button[aria-current="true"]{background:var(--red);color:#fff}
nav button svg{width:19px;height:19px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav .grupo{font-size:11px;font-weight:700;color:#6E6E6E;padding:14px 12px 6px;letter-spacing:.4px}
aside .rodape{padding:14px;border-top:1px solid rgba(255,255,255,.10)}
aside .rodape .quem{font-size:13px;font-weight:600}
aside .rodape .papel{font-size:11px;color:#9A9A9A;margin-bottom:10px}
aside .rodape button{width:100%;border:1px solid rgba(255,255,255,.25);background:transparent;color:#fff;border-radius:10px;padding:8px;font-size:12px;font-weight:600}

main{flex:1;min-width:0;display:flex;flex-direction:column}
.topo{background:#fff;border-bottom:1px solid var(--line);padding:16px 26px;display:flex;align-items:center;justify-content:space-between;gap:14px;position:sticky;top:0;z-index:10}
.topo h1{font-size:18px}
.topo .sub{font-size:12px;color:var(--mid)}
.abrir{display:none;background:transparent;border:0;padding:6px;margin-right:6px}
.abrir svg{width:24px;height:24px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round}
.conteudo{padding:22px 26px 60px;max-width:960px;width:100%}

.cartao{background:var(--card);border-radius:18px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.06);margin-bottom:14px}
.cartao h3{font-size:13px;font-weight:700;color:var(--mid);margin-bottom:12px}
.btn{border:2px solid var(--line);background:#fff;border-radius:999px;padding:8px 15px;font-size:13px;font-weight:600;color:var(--ink)}
.btn:hover{border-color:var(--ink)}
.btn.cheio{background:var(--red);border-color:var(--red);color:#fff}
.btn.cheio:hover{background:#C00000;border-color:#C00000}
.btn.mini{padding:5px 11px;font-size:12px}
.btn.perigo{color:var(--red);border-color:#F3C9C9}
.linhaBtn{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.vazio{color:var(--mid);font-size:14px;padding:10px 0}

/* ---------- avisos ---------- */
.aviso{background:#fff;border-radius:18px;padding:18px 20px;box-shadow:0 1px 3px rgba(0,0,0,.06);margin-bottom:12px;border-left:5px solid var(--line)}
.aviso.campanha{border-left-color:var(--red)}
.aviso.cupom{border-left-color:var(--ok)}
.aviso.fixado{background:#FFFDF5}
.aviso .cab{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.tag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:#F0F0F0;color:var(--mid);text-transform:uppercase;letter-spacing:.3px}
.tag.campanha{background:var(--red-soft);color:var(--red)}
.tag.cupom{background:#E6F3ED;color:var(--ok)}
.tag.novo{background:#111;color:#fff}
.aviso h4{font-size:16px;font-weight:700}
.aviso p.txt{font-size:14px;color:#3A3A3A;white-space:pre-wrap;margin-top:4px}
.aviso .pe{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--mid)}
.cupomBox{display:inline-flex;align-items:center;gap:10px;border:2px dashed var(--ok);border-radius:12px;padding:8px 12px;margin-top:10px}
.cupomBox code{font-size:15px;font-weight:700;letter-spacing:1px;color:var(--ok)}

/* ---------- listas ---------- */
.item{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .t{font-weight:600}
.item .d{font-size:13px;color:var(--mid)}
.item a{color:var(--red);font-weight:600;text-decoration:none;font-size:13px}

/* ---------- formulários ---------- */
.form{background:#FAFAFA;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.form label{display:block;font-size:12px;font-weight:600;color:var(--mid);margin:10px 0 4px}
.form input,.form textarea,.form select{width:100%;border:2px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff}
.form input:focus,.form textarea:focus,.form select:focus{outline:0;border-color:var(--red)}
.form textarea{min-height:84px;resize:vertical}
.form .duo{display:flex;gap:12px;flex-wrap:wrap}
.form .duo>div{flex:1;min-width:150px}
.form .acoes{margin-top:14px;display:flex;gap:8px}

iframe.modulo{width:100%;height:min(1180px,calc(100vh - 150px));border:1px solid var(--line);border-radius:18px;background:#fff}
.aviso-modo{background:#FFF8E1;border:1px solid #F0DFA8;color:#7A5B00;border-radius:12px;padding:10px 14px;font-size:12.5px;margin-bottom:14px}

@media (max-width:860px){
  aside{position:fixed;left:0;top:0;z-index:40;transform:translateX(-100%);transition:transform .2s}
  body.menu aside{transform:none}
  body.menu::after{content:'';position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:30}
  .abrir{display:block}
  .conteudo{padding:18px 16px 60px}
  .topo{padding:14px 16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<!-- ================= LOGIN ================= -->
<div id="login">
  <div class="box">
    <h1>Painel do Representante</h1>
    <p class="sub">Solturi Energia Solar</p>
    <label for="email">E-mail</label>
    <input id="email" type="email" autocomplete="username" placeholder="nome@solturi.com.br">
    <label for="senha">Senha</label>
    <input id="senha" type="password" autocomplete="current-password" placeholder="••••••••">
    <button class="principal" id="btnEntrar">Entrar</button>
    <p class="erro" id="loginErro"></p>
    <div class="demo" id="blocoDemo">
      <p>Banco de dados ainda não configurado. Entre em modo demonstração para conhecer o painel:</p>
      <div>
        <button data-papel="gestor">Como gestor</button>
        <button data-papel="representante">Como representante</button>
      </div>
    </div>
  </div>
</div>

<!-- ================= APP ================= -->
<div class="layout hidden" id="app">
  <aside>
    <div class="marca"><b>Solturi</b><span>Painel do representante</span></div>
    <nav id="menu"></nav>
    <div class="rodape">
      <div class="quem" id="quemNome">—</div>
      <div class="papel" id="quemPapel">—</div>
      <button id="btnSair">Sair</button>
    </div>
  </aside>
  <main>
    <div class="topo">
      <div style="display:flex;align-items:center">
        <button class="abrir" id="btnMenu" aria-label="Abrir menu">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div>
          <h1 id="tituloSecao">Mural</h1>
          <p class="sub" id="subSecao"></p>
        </div>
      </div>
      <div class="linhaBtn" id="acoesTopo"></div>
    </div>
    <div class="conteudo" id="conteudo"></div>
  </main>
</div>

<script>
/* =======================================================================
   CONFIGURAÇÃO
   Preencha as duas linhas abaixo com os dados do seu projeto Supabase.
   Enquanto ficarem vazias, o painel roda em modo demonstração (dados na
   memória, nada é salvo e nada é compartilhado entre pessoas).
   ======================================================================= */
const SUPABASE_URL = '';
const SUPABASE_ANON_KEY = '';
const URL_SIMULADOR = 'simulador.html';
/* ===================================================================== */

(function(){
  const $ = s => document.querySelector(s);
  const esc = t => String(t??'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const hoje = () => new Date().toISOString().slice(0,10);
  const dataBR = d => d ? new Date(d+'T12:00:00').toLocaleDateString('pt-BR') : '';
  const online = !!(SUPABASE_URL && SUPABASE_ANON_KEY);

  let sb = null, sessao = null, secaoAtual = 'mural';

  const ICONES = {
    mural:'<path d="M4 5h16v11H8l-4 3z"/>',
    simulador:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 11h3M8 15h3M14 11v4"/>',
    links:'<path d="M10 13a4 4 0 0 0 5.7.4l3-3a4 4 0 1 0-5.7-5.7L11.6 6"/><path d="M14 11a4 4 0 0 0-5.7-.4l-3 3a4 4 0 1 0 5.7 5.7L12.4 18"/>',
    telefones:'<path d="M5 4h4l2 5-2.5 1.5a12 12 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2.2 2A16 16 0 0 1 3 6.2 2 2 0 0 1 5 4z"/>',
    seguro:'<path d="M12 3 5 6v6c0 4.5 3 7.7 7 9 4-1.3 7-4.5 7-9V6z"/><path d="M9.5 12.5 11.5 14.5 15 11"/>',
    pagina:'<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/>',
    gestao:'<circle cx="12" cy="8" r="3"/><path d="M5.5 20a6.5 6.5 0 0 1 13 0"/>'
  };

  /* ---------------- dados de demonstração ---------------- */
  const demo = {
    perfil:{nome:'Usuário demo', email:'demo@solturi.com.br', papel:'gestor'},
    secoes:[
      {id:1, chave:'mural', titulo:'Mural', tipo:'mural', ordem:1, visivel:true},
      {id:2, chave:'simulador', titulo:'Simulador de financiamento', tipo:'simulador', ordem:2, visivel:true},
      {id:3, chave:'links', titulo:'Links úteis', tipo:'links', ordem:3, visivel:true},
      {id:4, chave:'seguro', titulo:'Simulador de Seguro e Limpeza', tipo:'seguro', ordem:4, visivel:true},
      {id:5, chave:'telefones', titulo:'Telefones internos', tipo:'telefones', ordem:5, visivel:true}
    ],
    avisos:[
      {id:1, titulo:'Campanha de setembro', texto:'Cessão de crédito com carência de 90 dias liberada para projetos acima de R$ 20 mil. Vale até o fim do mês.', categoria:'campanha', cupom:'', validade:'', fixado:true, criado_em:hoje()},
      {id:2, titulo:'Cupom de desconto no financiamento', texto:'Use na proposta para abater a taxa de cadastro do cliente.', categoria:'cupom', cupom:'SOLTURI10', validade:'', fixado:false, criado_em:hoje()}
    ],
    links:[
      {id:1, titulo:'Portal do parceiro Santander', url:'https://www.santander.com.br', categoria:'Financiamento', descricao:'Cadastro e acompanhamento de propostas', ordem:1},
      {id:2, titulo:'Catálogo WEG', url:'https://www.weg.net', categoria:'Produtos', descricao:'Datasheets de inversores e módulos', ordem:2}
    ],
    telefones:[
      {id:1, setor:'Comercial', nome:'Central de vendas', ramal:'201', whatsapp:'', ordem:1},
      {id:2, setor:'Engenharia', nome:'Projetos e homologação', ramal:'305', whatsapp:'', ordem:2},
      {id:3, setor:'Financeiro', nome:'Contas a receber', ramal:'410', whatsapp:'', ordem:3}
    ],
    paginas:{}
  };

  /* ---------------- camada de dados ---------------- */
  const db = {
    async listar(tabela){
      if(!online) return JSON.parse(JSON.stringify(demo[tabela]||[]));
      const {data,error} = await sb.from(tabela).select('*').order('ordem',{ascending:true, nullsFirst:false});
      if(error) throw error;
      return data;
    },
    async inserir(tabela, obj){
      if(!online){ obj.id = Date.now(); demo[tabela].unshift(obj); return obj; }
      const {data,error} = await sb.from(tabela).insert(obj).select().single();
      if(error) throw error;
      return data;
    },
    async atualizar(tabela, id, obj){
      if(!online){ const i = demo[tabela].findIndex(x=>x.id===id); demo[tabela][i] = {...demo[tabela][i], ...obj}; return; }
      const {error} = await sb.from(tabela).update(obj).eq('id',id);
      if(error) throw error;
    },
    async remover(tabela, id){
      if(!online){ demo[tabela] = demo[tabela].filter(x=>x.id!==id); return; }
      const {error} = await sb.from(tabela).delete().eq('id',id);
      if(error) throw error;
    }
  };

  const ehGestor = () => sessao && sessao.papel === 'gestor';

  /* ---------------- login ---------------- */
  async function iniciarSupabase(){
    if(!online) return;
    const {createClient} = await import('https://esm.sh/@supabase/supabase-js@2');
    sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    $('#blocoDemo').classList.add('hidden');
    const {data} = await sb.auth.getSession();
    if(data && data.session) await carregarPerfil(data.session.user);
  }

  async function carregarPerfil(user){
    const {data} = await sb.from('perfis').select('*').eq('id', user.id).single();
    sessao = {nome:(data&&data.nome)||user.email, email:user.email, papel:(data&&data.papel)||'representante'};
    entrar();
  }

  $('#btnEntrar').addEventListener('click', async ()=>{
    const erro = $('#loginErro'); erro.textContent='';
    if(!online){ erro.textContent = 'Configure o Supabase ou use o modo demonstração.'; return; }
    const {data,error} = await sb.auth.signInWithPassword({email:$('#email').value.trim(), password:$('#senha').value});
    if(error){ erro.textContent = 'E-mail ou senha incorretos.'; return; }
    await carregarPerfil(data.user);
  });
  $('#senha').addEventListener('keydown', e=>{ if(e.key==='Enter') $('#btnEntrar').click(); });

  document.querySelectorAll('#blocoDemo button').forEach(b=>{
    b.addEventListener('click', ()=>{
      sessao = {...demo.perfil, papel:b.dataset.papel,
                nome: b.dataset.papel==='gestor' ? 'Gestor (demo)' : 'Representante (demo)'};
      entrar();
    });
  });

  $('#btnSair').addEventListener('click', async ()=>{
    if(online && sb) await sb.auth.signOut();
    sessao = null;
    $('#app').classList.add('hidden');
    $('#login').classList.remove('hidden');
  });

  async function entrar(){
    $('#login').classList.add('hidden');
    $('#app').classList.remove('hidden');
    $('#quemNome').textContent = sessao.nome;
    $('#quemPapel').textContent = ehGestor() ? 'Gestor' : 'Representante';
    await montarMenu();
    abrir('mural');
  }

  /* ---------------- menu ---------------- */
  let secoes = [];
  async function montarMenu(){
    secoes = (await db.listar('secoes')).filter(s=> s.visivel || ehGestor());
    const menu = $('#menu'); menu.innerHTML='';
    secoes.forEach(s=> menu.appendChild(botaoMenu(s.chave, s.titulo, s.tipo, !s.visivel)));
    if(ehGestor()){
      const g = document.createElement('div'); g.className='grupo'; g.textContent='GESTÃO';
      menu.appendChild(g);
      menu.appendChild(botaoMenu('gestao','Seções e equipe','gestao'));
    }
  }
  function botaoMenu(chave, titulo, tipo, oculta){
    const b = document.createElement('button');
    b.innerHTML = '<svg viewBox="0 0 24 24">'+(ICONES[tipo]||ICONES.pagina)+'</svg><span>'+esc(titulo)+(oculta?' <small>(oculta)</small>':'')+'</span>';
    b.addEventListener('click', ()=>{ abrir(chave); document.body.classList.remove('menu'); });
    b.dataset.chave = chave;
    return b;
  }
  $('#btnMenu').addEventListener('click', ()=> document.body.classList.toggle('menu'));

  /* ---------------- render ---------------- */
  async function abrir(chave){
    secaoAtual = chave;
    document.querySelectorAll('#menu button').forEach(b=> b.setAttribute('aria-current', String(b.dataset.chave===chave)));
    const sec = secoes.find(s=>s.chave===chave) || {titulo:'Seções e equipe', tipo:'gestao'};
    $('#tituloSecao').textContent = sec.titulo;
    $('#subSecao').textContent = '';
    $('#acoesTopo').innerHTML = '';
    const alvo = $('#conteudo');
    alvo.innerHTML = online ? '' : '<div class="aviso-modo">Modo demonstração: os dados existem só nesta aba e não são compartilhados. Configure o Supabase para valer de verdade.</div>';
    if(sec.tipo==='mural')      return telaMural(alvo);
    if(sec.tipo==='simulador')  return telaSimulador(alvo);
    if(sec.tipo==='links')      return telaLinks(alvo);
    if(sec.tipo==='telefones')  return telaTelefones(alvo);
    if(sec.tipo==='seguro')     return telaSeguro(alvo);
    if(sec.tipo==='gestao')     return telaGestao(alvo);
    return telaPagina(alvo, sec);
  }

  /* ----- mural ----- */
  async function telaMural(alvo){
    $('#subSecao').textContent = 'Campanhas, cupons e recados da operação';
    const lista = await db.listar('avisos');
    lista.sort((a,b)=> (b.fixado?1:0)-(a.fixado?1:0) || String(b.criado_em).localeCompare(String(a.criado_em)));
    if(ehGestor()){
      const b = document.createElement('button');
      b.className='btn cheio'; b.textContent='Novo aviso';
      b.addEventListener('click', ()=> formAviso(null));
      $('#acoesTopo').appendChild(b);
    }
    const box = document.createElement('div'); box.id='listaAvisos';
    alvo.appendChild(box);
    if(!lista.length){ box.innerHTML = '<p class="vazio">Nenhum aviso publicado.</p>'; return; }
    lista.forEach(a=>{
      const vencido = a.validade && a.validade < hoje();
      const novo = a.criado_em && (Date.now() - new Date(a.criado_em+'T12:00:00')) < 7*864e5;
      const el = document.createElement('div');
      el.className = 'aviso '+(a.categoria||'')+(a.fixado?' fixado':'');
      el.style.opacity = vencido ? .55 : 1;
      el.innerHTML =
        '<div class="cab">'+
          (a.fixado?'<span class="tag">fixado</span>':'')+
          '<span class="tag '+esc(a.categoria)+'">'+esc(a.categoria||'aviso')+'</span>'+
          (novo?'<span class="tag novo">novo</span>':'')+
          (vencido?'<span class="tag">expirado</span>':'')+
        '</div>'+
        '<h4>'+esc(a.titulo)+'</h4>'+
        '<p class="txt">'+esc(a.texto)+'</p>'+
        (a.cupom?'<div class="cupomBox"><code>'+esc(a.cupom)+'</code><button class="btn mini" data-copiar="'+esc(a.cupom)+'">Copiar</button></div>':'')+
        '<div class="pe"><span>Publicado em '+dataBR(a.criado_em)+'</span>'+
          (a.validade?'<span>Válido até '+dataBR(a.validade)+'</span>':'')+'</div>';
      if(ehGestor()){
        const acoes = document.createElement('div');
        acoes.className='linhaBtn'; acoes.style.marginTop='12px';
        const ed = document.createElement('button'); ed.className='btn mini'; ed.textContent='Editar';
        ed.addEventListener('click', ()=> formAviso(a));
        const ex = document.createElement('button'); ex.className='btn mini perigo'; ex.textContent='Excluir';
        ex.addEventListener('click', async ()=>{ if(confirm('Excluir este aviso?')){ await db.remover('avisos', a.id); abrir(secaoAtual); } });
        acoes.append(ed,ex); el.appendChild(acoes);
      }
      box.appendChild(el);
    });
    box.addEventListener('click', e=>{
      const b = e.target.closest('[data-copiar]');
      if(b){ navigator.clipboard.writeText(b.dataset.copiar); b.textContent='Copiado'; setTimeout(()=>b.textContent='Copiar',1500); }
    });
  }

  function formAviso(a){
    const alvo = $('#conteudo');
    const f = document.createElement('div');
    f.className='form';
    f.innerHTML =
      '<label>Título</label><input id="fTit" value="'+esc(a?a.titulo:'')+'">'+
      '<label>Texto</label><textarea id="fTxt">'+esc(a?a.texto:'')+'</textarea>'+
      '<div class="duo">'+
        '<div><label>Categoria</label><select id="fCat">'+
          ['aviso','campanha','cupom'].map(c=>'<option value="'+c+'"'+(a&&a.categoria===c?' selected':'')+'>'+c+'</option>').join('')+
        '</select></div>'+
        '<div><label>Cupom (opcional)</label><input id="fCup" value="'+esc(a?a.cupom:'')+'"></div>'+
        '<div><label>Válido até</label><input id="fVal" type="date" value="'+esc(a?a.validade:'')+'"></div>'+
      '</div>'+
      '<label style="display:flex;align-items:center;gap:8px;margin-top:12px"><input type="checkbox" id="fFix" style="width:auto"'+(a&&a.fixado?' checked':'')+'> Fixar no topo</label>'+
      '<div class="acoes"><button class="btn cheio" id="fSalvar">Salvar</button><button class="btn" id="fCancelar">Cancelar</button></div>';
    alvo.insertBefore(f, $('#listaAvisos'));
    f.scrollIntoView({block:'center'});
    f.querySelector('#fCancelar').addEventListener('click', ()=> f.remove());
    f.querySelector('#fSalvar').addEventListener('click', async ()=>{
      const obj = {
        titulo:f.querySelector('#fTit').value.trim(),
        texto:f.querySelector('#fTxt').value.trim(),
        categoria:f.querySelector('#fCat').value,
        cupom:f.querySelector('#fCup').value.trim(),
        validade:f.querySelector('#fVal').value || null,
        fixado:f.querySelector('#fFix').checked
      };
      if(!obj.titulo) return alert('Informe o título.');
      if(a) await db.atualizar('avisos', a.id, obj);
      else { obj.criado_em = hoje(); await db.inserir('avisos', obj); }
      abrir(secaoAtual);
    });
  }

  /* ----- simulador ----- */
  function telaSimulador(alvo){
    $('#subSecao').textContent = 'Cessão de crédito, promoção e cartão';
    const f = document.createElement('iframe');
    f.className='modulo'; f.src = URL_SIMULADOR; f.title='Simulador de financiamento';
    alvo.appendChild(f);
  }

  /* ----- links ----- */
  async function telaLinks(alvo){
    const lista = await db.listar('links');
    if(ehGestor()){
      const b = document.createElement('button'); b.className='btn cheio'; b.textContent='Novo link';
      b.addEventListener('click', ()=> formSimples('links', null, [
        ['titulo','Título'],['url','Endereço (https://...)'],['categoria','Categoria'],['descricao','Descrição']
      ]));
      $('#acoesTopo').appendChild(b);
    }
    const cats = [...new Set(lista.map(l=>l.categoria||'Geral'))];
    if(!lista.length) alvo.insertAdjacentHTML('beforeend','<p class="vazio">Nenhum link cadastrado.</p>');
    cats.forEach(cat=>{
      const c = document.createElement('div'); c.className='cartao';
      c.innerHTML = '<h3>'+esc(cat)+'</h3>';
      lista.filter(l=>(l.categoria||'Geral')===cat).forEach(l=>{
        const it = document.createElement('div'); it.className='item';
        it.innerHTML = '<div><div class="t">'+esc(l.titulo)+'</div><div class="d">'+esc(l.descricao)+'</div></div>'+
                       '<div class="linhaBtn"><a href="'+esc(l.url)+'" target="_blank" rel="noopener">Abrir</a></div>';
        if(ehGestor()) it.querySelector('.linhaBtn').append(botoesCrud('links', l, [
          ['titulo','Título'],['url','Endereço'],['categoria','Categoria'],['descricao','Descrição']]));
        c.appendChild(it);
      });
      alvo.appendChild(c);
    });
  }

  /* ----- telefones ----- */
  async function telaTelefones(alvo){
    const lista = await db.listar('telefones');
    if(ehGestor()){
      const b = document.createElement('button'); b.className='btn cheio'; b.textContent='Novo contato';
      b.addEventListener('click', ()=> formSimples('telefones', null, [
        ['setor','Setor'],['nome','Nome / função'],['ramal','Ramal'],['whatsapp','WhatsApp']
      ]));
      $('#acoesTopo').appendChild(b);
    }
    const c = document.createElement('div'); c.className='cartao';
    c.innerHTML = '<h3>Contatos internos</h3>';
    if(!lista.length) c.insertAdjacentHTML('beforeend','<p class="vazio">Nenhum contato cadastrado.</p>');
    lista.forEach(t=>{
      const it = document.createElement('div'); it.className='item';
      it.innerHTML = '<div><div class="t">'+esc(t.nome)+'</div><div class="d">'+esc(t.setor)+'</div></div>'+
        '<div class="linhaBtn">'+(t.ramal?'<a href="tel:'+esc(t.ramal)+'">Ramal '+esc(t.ramal)+'</a>':'')+
        (t.whatsapp?'<a href="https://wa.me/'+esc(String(t.whatsapp).replace(/\D/g,''))+'" target="_blank" rel="noopener">WhatsApp</a>':'')+'</div>';
      if(ehGestor()) it.querySelector('.linhaBtn').append(botoesCrud('telefones', t, [
        ['setor','Setor'],['nome','Nome / função'],['ramal','Ramal'],['whatsapp','WhatsApp']]));
      c.appendChild(it);
    });
    alvo.appendChild(c);
  }

  /* ----- seguro (aguardando regras) ----- */
  function telaSeguro(alvo){
    alvo.insertAdjacentHTML('beforeend',
      '<div class="cartao"><h3>Em construção</h3>'+
      '<p style="font-size:14px;color:#3A3A3A">Este módulo vai calcular seguro e limpeza no mesmo padrão do simulador de financiamento. '+
      'Falta definir as regras: valores por faixa de potência ou por número de módulos, periodicidade da limpeza, '+
      'vigência e forma de cobrança do seguro.</p></div>');
  }

  /* ----- páginas livres ----- */
  async function telaPagina(alvo, sec){
    const c = document.createElement('div'); c.className='cartao';
    const conteudo = sec.conteudo || '';
    c.innerHTML = conteudo ? '<p style="white-space:pre-wrap;font-size:14.5px">'+esc(conteudo)+'</p>'
                           : '<p class="vazio">Página ainda sem conteúdo.</p>';
    alvo.appendChild(c);
    if(ehGestor()){
      const b = document.createElement('button'); b.className='btn cheio'; b.textContent='Editar página';
      b.addEventListener('click', ()=>{
        const f = document.createElement('div'); f.className='form';
        f.innerHTML = '<label>Conteúdo</label><textarea id="pTxt" style="min-height:220px">'+esc(conteudo)+'</textarea>'+
          '<div class="acoes"><button class="btn cheio" id="pSalvar">Salvar</button><button class="btn" id="pCancelar">Cancelar</button></div>';
        alvo.insertBefore(f, c);
        f.querySelector('#pCancelar').addEventListener('click', ()=> f.remove());
        f.querySelector('#pSalvar').addEventListener('click', async ()=>{
          await db.atualizar('secoes', sec.id, {conteudo:f.querySelector('#pTxt').value});
          await montarMenu(); abrir(sec.chave);
        });
      });
      $('#acoesTopo').appendChild(b);
    }
  }

  /* ----- gestão ----- */
  async function telaGestao(alvo){
    $('#subSecao').textContent = 'Abas do menu e permissões da equipe';
    const todas = await db.listar('secoes');
    const c = document.createElement('div'); c.className='cartao';
    c.innerHTML = '<h3>Abas do menu</h3>';
    todas.forEach(s=>{
      const it = document.createElement('div'); it.className='item';
      it.innerHTML = '<div><div class="t">'+esc(s.titulo)+'</div><div class="d">'+esc(s.tipo)+' · ordem '+s.ordem+'</div></div>';
      const acoes = document.createElement('div'); acoes.className='linhaBtn';
      const vis = document.createElement('button');
      vis.className='btn mini'; vis.textContent = s.visivel ? 'Ocultar' : 'Mostrar';
      vis.addEventListener('click', async ()=>{ await db.atualizar('secoes', s.id, {visivel:!s.visivel}); await montarMenu(); abrir('gestao'); });
      const sobe = document.createElement('button');
      sobe.className='btn mini'; sobe.textContent='↑';
      sobe.addEventListener('click', async ()=>{ await db.atualizar('secoes', s.id, {ordem:Math.max(1,(s.ordem||1)-1)}); await montarMenu(); abrir('gestao'); });
      const desce = document.createElement('button');
      desce.className='btn mini'; desce.textContent='↓';
      desce.addEventListener('click', async ()=>{ await db.atualizar('secoes', s.id, {ordem:(s.ordem||1)+1}); await montarMenu(); abrir('gestao'); });
      acoes.append(vis,sobe,desce);
      it.appendChild(acoes); c.appendChild(it);
    });
    const nova = document.createElement('button');
    nova.className='btn cheio'; nova.style.marginTop='14px'; nova.textContent='Nova aba de conteúdo';
    nova.addEventListener('click', async ()=>{
      const titulo = prompt('Nome da aba (ex.: Materiais de marketing):');
      if(!titulo) return;
      const chave = titulo.toLowerCase().normalize('NFD').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
      await db.inserir('secoes', {chave, titulo, tipo:'pagina', ordem:(todas.length||0)+1, visivel:true, conteudo:''});
      await montarMenu(); abrir('gestao');
    });
    c.appendChild(nova);
    alvo.appendChild(c);

    const e = document.createElement('div'); e.className='cartao';
    e.innerHTML = '<h3>Equipe</h3>' + (online
      ? '<p class="vazio">Os acessos são criados no painel do Supabase, em Authentication → Users, e o papel de cada pessoa fica na tabela <b>perfis</b>.</p>'
      : '<p class="vazio">Disponível quando o Supabase estiver configurado.</p>');
    alvo.appendChild(e);
  }

  /* ----- formulário genérico ----- */
  function formSimples(tabela, registro, campos){
    const alvo = $('#conteudo');
    const f = document.createElement('div'); f.className='form';
    f.innerHTML = campos.map(([k,rot])=>
      '<label>'+esc(rot)+'</label><input data-k="'+k+'" value="'+esc(registro?registro[k]:'')+'">').join('')+
      '<div class="acoes"><button class="btn cheio" data-ok>Salvar</button><button class="btn" data-cancel>Cancelar</button></div>';
    alvo.insertBefore(f, alvo.firstChild.nextSibling || alvo.firstChild);
    f.scrollIntoView({block:'center'});
    f.querySelector('[data-cancel]').addEventListener('click', ()=> f.remove());
    f.querySelector('[data-ok]').addEventListener('click', async ()=>{
      const obj = {};
      f.querySelectorAll('[data-k]').forEach(i=> obj[i.dataset.k] = i.value.trim());
      if(registro) await db.atualizar(tabela, registro.id, obj);
      else { obj.ordem = 99; await db.inserir(tabela, obj); }
      abrir(secaoAtual);
    });
  }
  function botoesCrud(tabela, registro, campos){
    const frag = document.createDocumentFragment();
    const ed = document.createElement('button'); ed.className='btn mini'; ed.textContent='Editar';
    ed.addEventListener('click', ()=> formSimples(tabela, registro, campos));
    const ex = document.createElement('button'); ex.className='btn mini perigo'; ex.textContent='Excluir';
    ex.addEventListener('click', async ()=>{ if(confirm('Excluir este item?')){ await db.remover(tabela, registro.id); abrir(secaoAtual); } });
    frag.append(ed,ex);
    return frag;
  }

  iniciarSupabase().catch(e=> console.error('Supabase:', e));
})();
</script>
